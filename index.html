<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convite</title>

    <!-- Preparação do site do convite -->
    <link rel="preconnect" href="https://entrelacosdigitais.com.br">
    <link rel="dns-prefetch" href="//entrelacosdigitais.com.br">
    <link rel="prefetch"
          href="https://entrelacosdigitais.com.br/jessica-e-carlos">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
        }

        .intro {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 9999;
            overflow: hidden;
        }

        /* Vídeo */
        #video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        /* Tela branca para a transição */
        #whiteFade {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 20;

            transition: opacity 1.2s ease;
        }

        #whiteFade.active {
            opacity: 1;
        }

        /* Evita seleção/acidental no celular */
        #video {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <div class="intro" id="intro">

        <!--
            SEU VÍDEO
            Coloque o arquivo aqui:
            Convite teste/Video/Convite-verde.mp4
        -->
        <video
            id="video"
            playsinline
            preload="auto"
            muted
        >
            <source src="Video/convite-verde.mp4" type="video/mp4">
        </video>

        <div id="whiteFade"></div>

    </div>

    <script>
        const video = document.getElementById("video");
        const whiteFade = document.getElementById("whiteFade");

        const conviteURL =
            "https://entrelacosdigitais.com.br/jessica-e-carlos";

        let started = false;

        // Função para resetar o estado inicial (usada ao carregar e ao voltar pelo histórico)
        function resetarVideo() {
            started = false;
            whiteFade.classList.remove("active");
            video.pause();
            video.currentTime = 0;
        }

        // Executa ao carregar a página
        window.addEventListener("DOMContentLoaded", () => {
            resetarVideo();
        });

        // Resolve o problema do botão "Voltar" do navegador (BFcache)
        window.addEventListener("pageshow", (event) => {
            if (event.persisted) {
                resetarVideo();
            }
        });

        // Evento de clique para iniciar o vídeo
        video.addEventListener("click", () => {
            if (started) return;

            started = true;

            // Começa o vídeo
            video.play().catch(error => {
                console.error("Não foi possível reproduzir o vídeo:", error);
                started = false; // Permite tentar de novo se falhar
            });
        });

        // Quando o vídeo terminar
        video.addEventListener("ended", () => {
            // Começa o branco
            whiteFade.classList.add("active");

            // Aguarda o fade terminar e redireciona
            setTimeout(() => {
                window.location.href = conviteURL;
            }, 1200);
        });
    </script>

</body>
</html>
